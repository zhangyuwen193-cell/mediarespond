<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
const APPS_SCRIPT_URL = = 'https://script.google.com/macros/s/AKfycbycuKkKpKXbqe002tGLYjNSEQzpGx8i0cGdZ74NEENg8ny0sL7nG2JsDu4e7AZC1ygU/exec';
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f5fb;
      color: #25324a;
      font-family: system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
    }

    main {
      width: min(900px, 100%);
      margin: auto;
      padding: 40px 20px 60px;
    }

    header {
      margin-bottom: 26px;
    }

    .eyebrow {
      color: #635bdb;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(26px, 5vw, 36px);
    }

    .description {
      margin: 0;
      color: #69758b;
      line-height: 1.8;
    }

    .search-panel {
      padding: 24px;
      background: white;
      border: 1px solid #e4e8f2;
      border-radius: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #cfd6e5;
      border-radius: 12px;
      font: inherit;
      font-size: 17px;
    }

    input:focus {
      outline: 3px solid #e5e2ff;
      border-color: #7065e8;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: #6255d9;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #5144c7;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .hint {
      margin: 12px 0 0;
      color: #758098;
      font-size: 13px;
      line-height: 1.7;
    }

    #status {
      margin: 18px 2px;
      color: #69758b;
      line-height: 1.7;
    }

    #status.error {
      color: #b42318;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 22px 0;
    }

    .metric {
      padding: 24px;
      background: white;
      border: 1px solid #e4e8f2;
      border-radius: 18px;
    }

    .metric-label {
      color: #69758b;
      font-size: 14px;
    }

    .metric-value {
      margin-top: 8px;
      color: #5144c7;
      font-size: 38px;
      font-weight: 800;
    }

    .metric-note {
      margin-top: 6px;
      color: #758098;
      font-size: 12px;
    }

    h2 {
      margin: 28px 0 16px;
      font-size: 22px;
    }

    .feedback-card {
      margin-bottom: 16px;
      padding: 22px;
      background: white;
      border: 1px solid #e4e8f2;
      border-radius: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .group-tag {
      padding: 6px 12px;
      border-radius: 30px;
      background: #eeebff;
      color: #5b4cce;
      font-size: 14px;
      font-weight: 700;
    }

    .score {
      color: #5144c7;
      font-weight: 700;
    }

    .topic {
      margin-top: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .feedback-text {
      margin: 16px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.9;
    }

    .time {
      color: #8b94a6;
      font-size: 12px;
    }

    .empty {
      padding: 40px 20px;
      border: 1px dashed #cfd6e5;
      border-radius: 18px;
      text-align: center;
      color: #758098;
      line-height: 1.8;
    }

    @media (max-width: 550px) {
      main {
        padding: 28px 14px 40px;
      }

      .search-panel {
        padding: 18px;
      }

      .search-row {
        flex-direction: column;
      }

      .summary {
        gap: 10px;
      }

      .metric {
        padding: 18px;
      }

      .metric-value {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="eyebrow">PEER FEEDBACK</div>
      <h1>小組評分與回饋</h1>
      <p class="description">
        輸入當週報告組別，查看其他組給你們的評分與回饋。
      </p>
    </header>

    <form id="searchForm" class="search-panel">
      <label for="groupInput">當週報告組別</label>

      <div class="search-row">
        <input
          id="groupInput"
          type="text"
          list="groupOptions"
          placeholder="例如：A"
          autocomplete="off"
          maxlength="30"
          required
        >

        <datalist id="groupOptions"></datalist>

        <button id="searchButton" type="submit">
          查詢回饋
        </button>
      </div>

      <p class="hint">
        可輸入 A、B、C 等組別。平均分數以其他組填寫的數字評分計算。
      </p>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <section id="results" aria-label="查詢結果"></section>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const groupInput = document.getElementById('groupInput');
    const searchButton = document.getElementById('searchButton');
    const statusBox = document.getElementById('status');
    const results = document.getElementById('results');

    // 載入試算表中已有的報告組別，作為輸入提示
    google.script.run
      .withSuccessHandler(groups => {
        const options = document.getElementById('groupOptions');

        groups.forEach(group => {
          const option = document.createElement('option');
          option.value = group;
          options.appendChild(option);
        });
      })
      .withFailureHandler(error => {
        showStatus(error.message || '無法載入組別。', true);
      })
      .getReportGroups();

    form.addEventListener('submit', event => {
      event.preventDefault();

      const group = groupInput.value.trim();
      if (!group) return;

      searchButton.disabled = true;
      groupInput.disabled = true;
      searchButton.textContent = '查詢中…';

      results.replaceChildren();
      showStatus('正在讀取最新評分與回饋…');

      google.script.run
        .withSuccessHandler(data => {
          resetButton();
          renderResults(data);
        })
        .withFailureHandler(error => {
          resetButton();
          showStatus(error.message || '查詢失敗，請稍後再試。', true);
        })
        .getGroupFeedback(group);
    });

    function resetButton() {
      searchButton.disabled = false;
      groupInput.disabled = false;
      searchButton.textContent = '查詢回饋';
    }

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.className = isError ? 'error' : '';
    }

    // 所有試算表文字都用 textContent 顯示
    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;

      return element;
    }

    function createMetric(label, value, note) {
      const card = createElement('div', 'metric');

      card.appendChild(createElement('div', 'metric-label', label));
      card.appendChild(createElement('div', 'metric-value', value));

      if (note) {
        card.appendChild(createElement('div', 'metric-note', note));
      }

      return card;
    }

    function renderResults(data) {
      results.replaceChildren();

      showStatus(
        `${data.group} 組｜共收到 ${data.count} 份其他組的回饋`
      );

      if (data.count === 0) {
        results.appendChild(
          createElement(
            'div',
            'empty',
            '目前沒有這一組收到的回饋，請確認組別是否正確，或稍後再查詢。'
          )
        );
        return;
      }

      const summary = createElement('div', 'summary');

      summary.appendChild(
        createMetric(
          '平均分數',
          data.average === null ? '—' : data.average.toFixed(2),
          `共 ${data.scoredCount} 筆有效數字評分`
        )
      );

      summary.appendChild(
        createMetric(
          '回饋份數',
          String(data.count),
          '已排除本組自己的評分'
        )
      );

      results.appendChild(summary);
      results.appendChild(
        createElement('h2', '', '逐筆評分與回饋')
      );

      data.items.forEach((item, index) => {
        const card = createElement('article', 'feedback-card');
        const header = createElement('div', 'card-header');

header.appendChild(
  createElement('span', 'group-tag', `回饋 ${index + 1}`)
);

        header.appendChild(
          createElement(
            'span',
            'score',
            item.scoreText ? `評分：${item.scoreText}` : '未填評分'
          )
        );

        card.appendChild(header);

        if (item.topic) {
          card.appendChild(
            createElement('div', 'topic', item.topic)
          );
        }

        card.appendChild(
          createElement(
            'p',
            'feedback-text',
            item.feedback || '（未填寫文字回饋）'
          )
        );

        if (item.time) {
          card.appendChild(
            createElement('div', 'time', item.time)
          );
        }

        results.appendChild(card);
      });
    }
  </script>
</body>
</html>
